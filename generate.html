<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Генератор ссылок — приглашение</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <style>
    @font-face {
      font-family: "Futura Light";
      src: url("fonts/futura-light.woff") format("woff");
      font-display: swap;
    }
    @font-face {
      font-family: "Futura Book";
      src: url("fonts/futura-book.woff") format("woff");
      font-display: swap;
    }
    @font-face {
      font-family: "Champion Script";
      src: url("fonts/champion-script.woff") format("woff");
      font-display: swap;
    }
    /* Raleway — для уйгурских букв (ғ, ә, қ…), которых нет в Futura */
    @font-face {
      font-family: "Raleway";
      src: url("fonts/raleway-cyrillic-ext.woff2") format("woff2");
      font-weight: 300 600;
      font-display: swap;
      unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
    }
    @font-face {
      font-family: "Raleway";
      src: url("fonts/raleway-cyrillic.woff2") format("woff2");
      font-weight: 300 600;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    :root {
      --font-text: "Futura Light", "Raleway", Arial, sans-serif;
      --font-bold: "Futura Book", "Raleway", Arial, sans-serif;
      --font-script: "Champion Script", cursive;
      --color-text: #2b2b2b;
      --color-muted: #7a6a6c;
      --color-rose: #ba797d;
      --color-green: #7b9b63;
      --color-green-dark: #4a6c30;
      --color-page: #e1bcbc;
      --color-card: #fff7f7;
      --color-button: #b4b897;
      --color-line: rgba(186, 121, 125, .35);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      padding: 32px 16px 48px;
      background: var(--color-page) url("images/background-flowers.jpg") center top / cover no-repeat fixed;
      color: var(--color-text);
      font-family: var(--font-text);
      font-size: 17px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 22px 26px;
      background: var(--color-card);
      border: 1px solid var(--color-line);
      box-shadow: 0 18px 50px rgba(90, 40, 45, .18);
    }

    h1 {
      margin: 0 0 4px;
      color: var(--color-rose);
      font-family: var(--font-script);
      font-weight: 400;
      font-size: 46px;
      line-height: 1;
      text-align: center;
    }

    .lead {
      margin: 0 0 22px;
      color: var(--color-muted);
      font-size: 14px;
      text-align: center;
    }

    fieldset {
      margin: 0 0 18px;
      padding: 0;
      border: 0;
    }

    legend, .label {
      display: block;
      margin: 0 0 8px;
      padding: 0;
      color: var(--color-green-dark);
      font-family: var(--font-bold);
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      position: relative;
      flex: 1 1 auto;
      min-width: 120px;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice span {
      display: block;
      padding: 10px 12px;
      border: 1px solid var(--color-line);
      background: #fff;
      color: var(--color-text);
      text-align: center;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    .choice input:checked + span {
      border-color: var(--color-rose);
      background: var(--color-rose);
      color: #fff;
    }

    .choice input:focus-visible + span {
      outline: 2px solid var(--color-green);
      outline-offset: 2px;
    }

    .input {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-line);
      background: #fff;
      color: var(--color-text);
      font: inherit;
    }

    .input:focus {
      outline: 2px solid var(--color-green);
      outline-offset: 0;
      border-color: var(--color-green);
    }

    .hint {
      margin: 6px 0 0;
      color: var(--color-muted);
      font-size: 13px;
    }

    .preview {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--color-rose);
      background: #fff;
    }

    .preview__title {
      margin: 0 0 4px;
      color: var(--color-rose);
      font-family: var(--font-bold);
      font-size: 22px;
    }

    .preview__meta {
      margin: 0;
      color: var(--color-muted);
      font-size: 14px;
    }

    .result {
      display: flex;
      gap: 8px;
    }

    .result .input {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 14px;
      color: var(--color-green-dark);
      word-break: break-all;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 10px 18px;
      white-space: nowrap;
      border: 0;
      background: var(--color-button);
      color: #fff;
      font-family: var(--font-bold);
      font-size: 15px;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .15s;
    }

    .button:hover { background: var(--color-green); }
    .button:active { background: var(--color-green-dark); }
    .button.is-done { background: var(--color-green-dark); }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 14px;
    }

    .actions a {
      color: var(--color-green-dark);
    }

    .length {
      color: var(--color-muted);
    }

    @media (max-width: 420px) {
      .result { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>

<main class="page">
  <h1>Ссылка для гостя</h1>
  <p class="lead">Выберите язык и музыку, впишите имена — ссылка соберётся сама</p>

  <form id="form" autocomplete="off">
    <fieldset>
      <legend>Язык</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="lang" value="ru" checked><span>Русский</span></label>
        <label class="choice"><input type="radio" name="lang" value="ug"><span>Уйгурская</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Музыка</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="music" value="" checked><span>Уйгурская</span></label>
        <label class="choice"><input type="radio" name="music" value="ar"><span>Арабская</span></label>
        <label class="choice"><input type="radio" name="music" value="ru"><span>Русская</span></label>
      </div>
    </fieldset>

    <fieldset>
      <label class="label" for="names">Имена гостей</label>
      <input class="input" id="names" type="text" placeholder="Султан, Гульзара" inputmode="text">
      <p class="hint">Несколько имён через запятую. Пусто — обращение «Дорогие гости!»</p>
    </fieldset>
  </form>

  <div class="preview">
    <p class="preview__title" id="previewTitle">Дорогие гости!</p>
    <p class="preview__meta" id="previewMeta">Русский · основная музыка</p>
  </div>

  <div class="result">
    <input class="input" id="link" type="text" readonly>
    <button class="button" id="copy" type="button">Скопировать</button>
  </div>

  <div class="actions">
    <a id="open" href="index.html" target="_blank" rel="noopener">Открыть приглашение ↗</a>
    <span class="length" id="length"></span>
  </div>
</main>

<script>
  // Словарь обращений повторяет js/i18n.js, а логика — js/personalize.js
  const T = {
    ru: { title: 'Дорогие гости!', dear: 'Дорогие', dearHe: 'Дорогой', dearShe: 'Дорогая', and: 'и', langName: 'Русский' },
    ug: { title: 'Қәдирлик меһманлар!', dear: 'Қәдирлик', dearHe: 'Қәдирлик', dearShe: 'Қәдирлик', and: 'вә', langName: 'Уйгурский' },
  };
  const MUSIC_NAME = { '': 'уйгурская музыка', ar: 'арабская музыка', ru: 'русская музыка' };

  // Адрес приглашения — та же папка, где лежит генератор
  const BASE = location.href.replace(/[^/]*$/, '');

  const form = document.getElementById('form');
  const namesInput = document.getElementById('names');
  const linkInput = document.getElementById('link');
  const copyButton = document.getElementById('copy');
  const openLink = document.getElementById('open');
  const previewTitle = document.getElementById('previewTitle');
  const previewMeta = document.getElementById('previewMeta');
  const lengthLabel = document.getElementById('length');

  const parseNames = (raw) => raw
    .split(/\s*[,;|\n]\s*|\s+и\s+|\s+вә\s+/)
    .map((name) => name.replace(/[&=#?+%\/\\"'«»]/g, '').trim())
    .filter(Boolean);

  const greeting = (names, lang) => {
    const d = T[lang];
    if (!names.length) return d.title;
    const joined = names.join(` ${d.and} `);
    if (names.length > 1) return `${d.dear} ${joined}!`;
    const feminine = /[ая]$/i.test(names[0]);
    return `${feminine ? d.dearShe : d.dearHe} ${joined}!`;
  };

  // Ссылка собирается без encodeURIComponent: кириллица остаётся читаемой, процентов нет.
  // Имена передаются «голыми» ключами (?Султан&Гульзара) — так короче, personalize.js это понимает.
  const buildLink = ({ lang, music, names }) => {
    const parts = [];
    if (lang !== 'ru') parts.push(`lang=${lang}`);
    if (music) parts.push(`music=${music}`);
    parts.push(...names.map((name) => name.replace(/\s+/g, '+')));
    return parts.length ? `${BASE}?${parts.join('&')}` : BASE;
  };

  const state = () => ({
    lang: form.lang.value,
    music: form.music.value,
    names: parseNames(namesInput.value),
  });

  const render = () => {
    const s = state();
    const link = buildLink(s);
    linkInput.value = link;
    openLink.href = link;
    previewTitle.textContent = greeting(s.names, s.lang);
    previewMeta.textContent = `${T[s.lang].langName} · ${MUSIC_NAME[s.music]}`;
    lengthLabel.textContent = `${link.length} символов`;
    copyButton.classList.remove('is-done');
    copyButton.textContent = 'Скопировать';
  };

  const copy = async () => {
    const text = linkInput.value;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      linkInput.focus();
      linkInput.select();
      document.execCommand('copy');
    }
    copyButton.classList.add('is-done');
    copyButton.textContent = 'Скопировано ✓';
    setTimeout(() => {
      copyButton.classList.remove('is-done');
      copyButton.textContent = 'Скопировать';
    }, 2000);
  };

  form.addEventListener('input', render);
  form.addEventListener('submit', (e) => { e.preventDefault(); copy(); });
  copyButton.addEventListener('click', copy);
  linkInput.addEventListener('focus', () => linkInput.select());

  render();
</script>

</body>
</html>
